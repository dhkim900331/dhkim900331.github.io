<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DongDong Blog Editor</title>
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <header>
    <div><strong>DongDong Blog Editor</strong><span id="status">저장소를 선택하세요.</span></div>
    <div class="actions">
      <button id="chooseRoot">블로그 저장소 선택</button>
      <button id="newPost">새 글</button>
      <button id="openPost">기존 글 열기</button>
      <button id="importImage">이미지 추가</button>
      <button id="copyImageUrl">마지막 이미지 URL 복사</button>
      <button id="save" class="primary">저장</button>
    </div>
  </header>
  <section class="meta">
    <label>카테고리 <select id="category"></select></label>
    <label>slug <input id="slug" placeholder="jdbc-store-recovery"></label>
    <label>한 번 줄바꿈 <input id="oneBreak" type="number" min="2" value="2"></label>
    <label>두 번 줄바꿈 <input id="twoBreak" type="number" min="3" value="4"></label>
    <span class="hint">이미지 alt는 파일명으로 자동 입력됩니다. 연속 Enter 기준은 코드 블록에 적용하지 않습니다.</span>
  </section>
  <main>
    <section class="pane"><h2>Markdown <small id="fileName">새 초안</small></h2><textarea id="source" spellcheck="false" placeholder="Markdown을 작성하거나 이미지를 여기로 끌어놓으세요."></textarea></section>
    <section class="pane preview"><h2>미리보기</h2><article id="rendered"></article></section>
  </main>
  <input id="imagePicker" type="file" accept="image/png,image/jpeg,image/gif,image/webp" hidden>
  <script src="editor.js"></script>
</body>
</html>
